<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XP Dashboard</title>

  <!-- Portals SDK: must be loaded before your listener -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js"></script>

  <script>
    // Queue messages that arrive before the app is ready
    window.__portalsMessageQueue = [];
    window.__portalsAppReady = false;
    window.__portalsReceive = null;

    function __handleRawPortalsMessage(message) {
      console.log("[Portals raw message]", message);

      if (window.__portalsAppReady && typeof window.__portalsReceive === "function") {
        window.__portalsReceive(message);
      } else {
        window.__portalsMessageQueue.push(message);
      }
    }

    if (window.PortalsSdk && typeof window.PortalsSdk.setMessageListener === "function") {
      window.PortalsSdk.setMessageListener(__handleRawPortalsMessage);
      console.log("[Portals] listener attached");
    } else {
      console.warn("[Portals] PortalsSdk not found");
    }
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: transparent;
    }

    .wrap {
      width: 620px;
      padding: 24px 28px;
    }

    .label {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .xp-text {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .bar {
      width: 600px;
      height: 40px;
      background: rgba(48, 32, 20, 0.75);
      box-shadow: 0 10px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f2b200 0%, #ffc400 82%, #fff0a8 92%, #ffcf33 100%);
      transition: width 0.45s ease;
      position: relative;
    }

    .fill::after {
      content: "";
      position: absolute;
      right: -22px;
      top: 0;
      width: 44px;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,225,120,0.1));
      transform: skewX(-20deg);
      filter: blur(1px);
      opacity: 0.95;
    }

    .debug {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.85;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="levelLabel" class="label">Level 1</div>
    <div id="xpText" class="xp-text">0/100</div>
    <div class="bar">
      <div id="fill" class="fill"></div>
    </div>
    <div id="debug" class="debug">Waiting for Portals message...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tpdedcjccygpwkofdyqg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kYGFYlXrQHt17-uihwy7tA_CxkbQYNH';

    const levelLabel = document.getElementById("levelLabel");
    const xpText = document.getElementById("xpText");
    const fill = document.getElementById("fill");
    const debug = document.getElementById("debug");

    function log(msg) {
      console.log(msg);
      debug.textContent = String(msg);
    }

    function xpForLevel(level) {
      return 100;
    }

    function deriveLevelAndProgress(totalXp) {
      let level = Math.floor(totalXp / 100) + 1;
      let current = totalXp % 100;
      let needed = xpForLevel(level);
      return { level, current, needed };
    }

    function renderXp(totalXp) {
      const { level, current, needed } = deriveLevelAndProgress(totalXp);
      levelLabel.textContent = `Level ${level}`;
      xpText.textContent = `${current}/${needed}`;
      fill.style.width = `${Math.max(0, Math.min(100, (current / needed) * 100))}%`;
    }

    async function rpc(fn, body) {
      const headers = {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      };

      // Legacy anon keys are JWT-like; publishable keys are not.
      if (SUPABASE_KEY.split(".").length === 3) {
        headers["Authorization"] = `Bearer ${SUPABASE_KEY}`;
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers,
        body: JSON.stringify(body)
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        throw data || { message: `HTTP ${res.status}` };
      }

      return data;
    }

    async function getPlayerProgress(username) {
      const data = await rpc("get_player_progress", { p_username: username });
      return Array.isArray(data) ? data[0] : data;
    }

    async function addPlayerXp(username, xpGain) {
      const data = await rpc("add_player_xp", {
        p_username: username,
        p_xp_gain: xpGain
      });
      return Array.isArray(data) ? data[0] : data;
    }

    function extractXpGain(payload, username) {
      const raw = payload?.xp_gain;

      if (typeof raw === "number") return raw;
      if (typeof raw === "string" && raw.trim() !== "" && !Number.isNaN(Number(raw))) {
        return Number(raw);
      }

      // Handles Portals player-variable map style if needed
      if (raw && typeof raw === "object" && username in raw) {
        const v = raw[username];
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      }

      return 0;
    }

    async function processPortalsMessage(message) {
      log(`[received] ${message}`);

      let payload;
      try {
        payload = JSON.parse(message);
      } catch (err) {
        log(`[parse error] ${message}`);
        return;
      }

      const username = payload?.username;
      if (!username) {
        log("[error] missing username");
        return;
      }

      const xpGain = extractXpGain(payload, username);

      try {
        const updated = await addPlayerXp(username, xpGain);
        renderXp(Number(updated?.xp || 0));
        log(`[ok] ${username} +${xpGain} XP -> ${updated?.xp ?? 0}`);
      } catch (err) {
        console.error(err);
        log(`[db error] ${JSON.stringify(err)}`);
      }
    }

    async function boot() {
      window.__portalsReceive = processPortalsMessage;
      window.__portalsAppReady = true;

      // Drain any early messages
      while (window.__portalsMessageQueue.length > 0) {
        const msg = window.__portalsMessageQueue.shift();
        await processPortalsMessage(msg);
      }

      log("App ready. Waiting for Portals...");
    }

    boot();
  </script>
</body>
</html>
