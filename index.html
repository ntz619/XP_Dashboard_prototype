<script>
  const SUPABASE_URL = 'https://tpdedcjccygpwkofdyqg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_kYGFYlXrQHt17-uihwy7tA_CxkbQYNH';

  const LEVEL_UP_SOUND_URL = 'https://ntz619.github.io/XP_Dashboard_prototype/universfield-level-up-04-243762.mp3';

  const BASE_XP_PER_LEVEL = 100;
  const XP_GROWTH_FACTOR = 1.18;
  const XP_STEP_ROUNDING = 5;
  const MIN_XP_STEP = 10;
  const POLL_INTERVAL_MS = 5000;

  const xpTableCache = [0, BASE_XP_PER_LEVEL];

  let currentUsername = null;
  let pollHandle = null;
  let displayedTotalXp = 0;
  let animationFrame = null;
  let hasInitialXpLoaded = false;

  const hudEl = document.getElementById('hud');
  const barEl = document.getElementById('bar');
  const fillEl = document.getElementById('fill');
  const xpTextEl = document.getElementById('xpText');
  const levelLabelEl = document.getElementById('levelLabel');
  const levelUpPillEl = document.getElementById('levelUpPill');
  const gainLayerEl = document.getElementById('gainLayer');
  const sparkLayerEl = document.getElementById('sparkLayer');
  const flashLayerEl = document.getElementById('flashLayer');

  const levelUpAudio = new Audio(LEVEL_UP_SOUND_URL);
  levelUpAudio.preload = 'auto';

  function playLevelUpSound() {
    const sound = levelUpAudio.cloneNode();
    sound.volume = 1;
    sound.play().catch(() => {});
  }

  function xpNeededForLevel(level) {
    if (level <= 1) return BASE_XP_PER_LEVEL;
    if (xpTableCache[level]) return xpTableCache[level];

    for (let i = xpTableCache.length; i <= level; i++) {
      const raw = BASE_XP_PER_LEVEL * Math.pow(XP_GROWTH_FACTOR, i - 1);
      const rounded = Math.round(raw / XP_STEP_ROUNDING) * XP_STEP_ROUNDING;
      const previous = xpTableCache[i - 1];
      xpTableCache[i] = Math.max(rounded, previous + MIN_XP_STEP);
    }

    return xpTableCache[level];
  }

  function deriveLevelData(totalXp) {
    const xp = Math.max(0, Number(totalXp) || 0);

    let level = 1;
    let remainingXp = xp;
    let needed = xpNeededForLevel(level);

    while (remainingXp >= needed) {
      remainingXp -= needed;
      level += 1;
      needed = xpNeededForLevel(level);
    }

    const current = remainingXp;
    const percent = needed > 0 ? (current / needed) * 100 : 0;

    return { xp, level, current, needed, percent };
  }

  function setFillWidth(percent) {
    const clamped = Math.max(0, Math.min(100, percent));
    if (clamped <= 0) {
      fillEl.style.width = '0%';
    } else {
      fillEl.style.width = `calc(${clamped}% + var(--fill-slant))`;
    }
  }

  function renderXp(totalXp) {
    const { level, current, needed, percent } = deriveLevelData(totalXp);
    levelLabelEl.textContent = `Level ${level}`;
    xpTextEl.textContent = `${Math.round(current)}/${needed}`;
    setFillWidth(percent);
    displayedTotalXp = totalXp;
  }

  function setXpInstant(totalXp) {
    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }

    renderXp(totalXp);
    hasInitialXpLoaded = true;
  }

  function animateNumberToXp(targetXp, xpGain = 0) {
    const startXp = displayedTotalXp;
    const endXp = Math.max(0, Number(targetXp) || 0);
    const startLevel = deriveLevelData(startXp).level;
    const endLevel = deriveLevelData(endXp).level;
    const duration = Math.min(1500, Math.max(650, Math.abs(endXp - startXp) * 12));
    const startedAt = performance.now();

    if (animationFrame) cancelAnimationFrame(animationFrame);

    triggerGainEffects(xpGain);

    let levelFxTriggered = startLevel;

    function frame(now) {
      const t = Math.min(1, (now - startedAt) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const value = startXp + (endXp - startXp) * eased;
      const { level, current, needed, percent } = deriveLevelData(value);

      levelLabelEl.textContent = `Level ${level}`;
      xpTextEl.textContent = `${Math.round(current)}/${needed}`;
      setFillWidth(percent);
      displayedTotalXp = value;

      if (level > levelFxTriggered) {
        levelFxTriggered = level;
        triggerLevelUp(level);
      }

      if (t < 1) {
        animationFrame = requestAnimationFrame(frame);
      } else {
        displayedTotalXp = endXp;
        renderXp(endXp);
        if (endLevel > startLevel) {
          triggerLevelUp(endLevel);
        }
        animationFrame = null;
      }
    }

    animationFrame = requestAnimationFrame(frame);
  }

  function triggerGainEffects(xpGain) {
    const gain = Math.max(0, Number(xpGain) || 0);
    hudEl.classList.remove('hit');
    barEl.classList.remove('hit');
    fillEl.classList.remove('animate-shimmer');
    xpTextEl.classList.remove('bump');

    void hudEl.offsetWidth;
    hudEl.classList.add('hit');
    barEl.classList.add('hit');
    fillEl.classList.add('animate-shimmer');
    xpTextEl.classList.add('bump');

    if (gain > 0) {
      spawnGainText(gain);
      spawnSparkBurst();
      spawnFlash();
    }

    setTimeout(() => {
      hudEl.classList.remove('hit');
      barEl.classList.remove('hit');
      fillEl.classList.remove('animate-shimmer');
      xpTextEl.classList.remove('bump');
    }, 900);
  }

  function spawnGainText(gain) {
    const el = document.createElement('div');
    el.className = 'xp-gain';
    el.textContent = `+${gain} XP`;
    gainLayerEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }

  function spawnSparkBurst() {
    const width = barEl.clientWidth;
    const fillWidth = Math.max(9, fillEl.getBoundingClientRect().width);
    const centerX = Math.min(width - 12, Math.max(13, fillWidth));
    const centerY = barEl.clientHeight / 2;
    const sparks = 12;

    for (let i = 0; i < sparks; i++) {
      const angle = (-70 + (140 / Math.max(1, sparks - 1)) * i) * (Math.PI / 180);
      const distance = 10 + Math.random() * 21;
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = `${centerX}px`;
      spark.style.top = `${centerY}px`;
      spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      spark.style.setProperty('--life', `${650 + Math.random() * 350}ms`);
      sparkLayerEl.appendChild(spark);
      requestAnimationFrame(() => spark.classList.add('show'));
      spark.addEventListener('animationend', () => spark.remove(), { once: true });
    }
  }

  function spawnFlash() {
    const width = barEl.clientWidth;
    const fillWidth = Math.max(9, fillEl.getBoundingClientRect().width);
    const x = Math.min(width - 5, Math.max(4, fillWidth));
    const flash = document.createElement('div');
    flash.className = 'flash';
    flash.style.setProperty('--flash-x', `${(x / width) * 100}%`);
    flashLayerEl.appendChild(flash);
    requestAnimationFrame(() => flash.classList.add('show'));
    flash.addEventListener('animationend', () => flash.remove(), { once: true });
  }

  function triggerLevelUp(level) {
    levelUpPillEl.textContent = `LEVEL ${level}!`;
    levelUpPillEl.classList.remove('show');
    void levelUpPillEl.offsetWidth;
    levelUpPillEl.classList.add('show');

    playLevelUpSound();
    spawnFlash();
    spawnSparkBurst();
  }

  function normalizePortalsJsonish(raw) {
    return String(raw)
      .trim()
      .replace(/=\s*(?=[\[{\"\-\dtruefalsen])/g, ':')
      .replace(/\r?\n/g, ' ');
  }

  function parsePortalsMessage(rawMessage) {
    const raw = String(rawMessage || '').trim();
    if (!raw) throw new Error('Empty message');

    const attempts = [raw, normalizePortalsJsonish(raw)];
    for (const candidate of attempts) {
      try {
        const parsed = JSON.parse(candidate);
        if (parsed && typeof parsed === 'object') return parsed;
      } catch (_) {}
    }

    const usernameMatch = raw.match(/username\s*=\s*(".*?"|[^;\s]+)/i);
    const xpGainMatch = raw.match(/xp_gain\s*=\s*(\{.*\}|".*?"|[^;\s]+)/i);

    if (usernameMatch || xpGainMatch) {
      const payload = {};

      if (usernameMatch) {
        const value = usernameMatch[1].trim();
        payload.username = value.startsWith('"') ? JSON.parse(value) : value;
      }

      if (xpGainMatch) {
        const value = xpGainMatch[1].trim();
        if (value.startsWith('{')) payload.xp_gain = JSON.parse(normalizePortalsJsonish(value));
        else if (value.startsWith('"')) payload.xp_gain = JSON.parse(value);
        else payload.xp_gain = Number(value);
      }

      return payload;
    }

    throw new Error(`Could not parse Portals message: ${raw}`);
  }

  function extractXpGain(payload) {
    const username = typeof payload.username === 'string' ? payload.username : null;
    let xpGain = payload.xp_gain;

    if (xpGain && typeof xpGain === 'object' && !Array.isArray(xpGain)) {
      if (!username) throw new Error('xp_gain arrived as a player-variable map, but no username was present');
      xpGain = xpGain[username];
    }

    const numeric = Number(xpGain);
    if (!Number.isFinite(numeric)) throw new Error(`xp_gain is not a valid number: ${xpGain}`);
    return Math.max(0, Math.floor(numeric));
  }

  function buildHeaders() {
    const headers = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
    };

    if (!SUPABASE_KEY.startsWith('sb_publishable_')) {
      headers['Authorization'] = `Bearer ${SUPABASE_KEY}`;
    }

    return headers;
  }

  async function callRpc(fnName, body) {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
      method: 'POST',
      headers: buildHeaders(),
      body: JSON.stringify(body),
      cache: 'no-store',
    });

    const text = await response.text();
    let data = null;

    try {
      data = text ? JSON.parse(text) : null;
    } catch {
      data = text;
    }

    if (!response.ok) {
      const message = data && typeof data === 'object'
        ? (data.message || JSON.stringify(data))
        : String(data || response.statusText);
      throw new Error(message);
    }

    return data;
  }

  function firstRow(data) {
    return Array.isArray(data) ? data[0] : data;
  }

  async function getPlayerProgress(username) {
    const data = await callRpc('get_player_progress', { p_username: username });
    return firstRow(data);
  }

  async function addPlayerXp(username, xpGain) {
    const data = await callRpc('add_player_xp', {
      p_username: username,
      p_xp_gain: xpGain,
    });
    return firstRow(data);
  }

  async function refreshCurrentPlayer() {
    if (!currentUsername) return;

    try {
      const row = await getPlayerProgress(currentUsername);
      if (row && typeof row.xp !== 'undefined') {
        const nextXp = Number(row.xp) || 0;

        if (!hasInitialXpLoaded) {
          setXpInstant(nextXp);
        } else {
          renderXp(nextXp);
        }
      }
    } catch (_) {}
  }

  function startPolling() {
    if (pollHandle) clearInterval(pollHandle);
    pollHandle = setInterval(refreshCurrentPlayer, POLL_INTERVAL_MS);
  }

  async function handlePortalsMessage(message) {
    try {
      const payload = parsePortalsMessage(message);
      const username = typeof payload.username === 'string' ? payload.username : null;
      if (!username) throw new Error('Missing username in Portals message');

      const xpGain = extractXpGain(payload);
      currentUsername = username;

      const row = await addPlayerXp(username, xpGain);
      if (!row || typeof row.xp === 'undefined') throw new Error('RPC returned no player row');

      const nextXp = Number(row.xp) || 0;

      if (!hasInitialXpLoaded) {
        setXpInstant(nextXp);
      } else {
        animateNumberToXp(nextXp, xpGain);
      }

      startPolling();
    } catch (_) {}
  }

  window.handlePortalsMessage = handlePortalsMessage;

  renderXp(0);

  PortalsSdk.setMessageListener((message) => {
    handlePortalsMessage(message);
  });

  window.addEventListener('message', (event) => {
    if (typeof event.data === 'string') {
      // fallback listener kept for browser/dev environments
    }
  });
</script>
