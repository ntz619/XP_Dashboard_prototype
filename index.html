<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XP Dashboard</title>
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>
  <style>
    @font-face {
      font-family: 'ObelixPro';
      src: url('./obelix-pro-3.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bar-height: 82px;
      --bar-radius: 0px;
      --track: rgba(62, 47, 34, 0.9);
      --track-2: rgba(71, 55, 40, 0.95);
      --gold-1: #ffc400;
      --gold-2: #ffbf00;
      --gold-3: #f2b400;
      --text: #ffffff;
      --shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 28px;
      color: var(--text);
      font-family: 'ObelixPro', Arial, sans-serif;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      pointer-events: none;
    }

    .wrap {
      width: min(760px, calc(100vw - 56px));
      pointer-events: none;
    }

    .level-label {
      margin: 0 0 8px 10px;
      font-size: 22px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      letter-spacing: 0.3px;
    }

    .bar {
      position: relative;
      width: 100%;
      height: var(--bar-height);
      background: linear-gradient(90deg, var(--track-2) 0%, var(--track) 100%);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(180deg, #ffcb07 0%, var(--gold-2) 55%, var(--gold-3) 100%);
      transition: width 380ms ease;
      will-change: width;
    }

    .fill::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.02) 28%, rgba(0,0,0,0.08) 100%);
      pointer-events: none;
    }

    .fill::after {
      content: '';
      position: absolute;
      top: -16%;
      right: -24px;
      width: 56px;
      height: 132%;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,245,196,0.85) 38%, rgba(255,214,80,0.2) 100%);
      transform: skewX(-23deg);
      filter: blur(2px);
      opacity: 0.95;
      box-shadow: 0 0 16px rgba(255, 226, 119, 0.8);
    }

    .xp-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-size: 28px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      z-index: 2;
      white-space: nowrap;
    }

    .status {
      margin: 8px 0 0 10px;
      min-height: 18px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      opacity: 0.85;
    }

    .status.error {
      color: #ffd0d0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="levelLabel" class="level-label">Level 1</div>
    <div class="bar" aria-label="XP progress">
      <div id="fill" class="fill"></div>
      <div id="xpText" class="xp-text">0/100</div>
    </div>
    <div id="status" class="status">Waiting for Portals message...</div>
  </div>

  <script>
    // =========================
    // CONFIG
    // =========================
    const SUPABASE_URL = 'https://tpdedcjccygpwkofdyqg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kYGFYlXrQHt17-uihwy7tA_CxkbQYNH';
    const XP_PER_LEVEL = 100;
    const POLL_INTERVAL_MS = 5000;

    // =========================
    // STATE
    // =========================
    let currentUsername = null;
    let pollHandle = null;

    const levelLabelEl = document.getElementById('levelLabel');
    const xpTextEl = document.getElementById('xpText');
    const fillEl = document.getElementById('fill');
    const statusEl = document.getElementById('status');

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function deriveLevelData(totalXp) {
      const xp = Math.max(0, Number(totalXp) || 0);
      const level = Math.floor(xp / XP_PER_LEVEL) + 1;
      const current = xp % XP_PER_LEVEL;
      const needed = XP_PER_LEVEL;
      const percent = needed === 0 ? 0 : (current / needed) * 100;
      return { xp, level, current, needed, percent };
    }

    function renderXp(totalXp) {
      const { level, current, needed, percent } = deriveLevelData(totalXp);
      levelLabelEl.textContent = `Level ${level}`;
      xpTextEl.textContent = `${current}/${needed}`;
      fillEl.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function normalizePortalsJsonish(raw) {
      return String(raw)
        .trim()
        .replace(/=\s*(?=[\[{\"\-\dtruefalsen])/g, ':')
        .replace(/\r?\n/g, ' ');
    }

    function parsePortalsMessage(rawMessage) {
      const raw = String(rawMessage || '').trim();
      if (!raw) {
        throw new Error('Empty message');
      }

      const attempts = [
        raw,
        normalizePortalsJsonish(raw),
      ];

      for (const candidate of attempts) {
        try {
          const parsed = JSON.parse(candidate);
          if (parsed && typeof parsed === 'object') {
            return parsed;
          }
        } catch (_) {}
      }

      const usernameMatch = raw.match(/username\s*=\s*(".*?"|[^;\s]+)/i);
      const xpGainMatch = raw.match(/xp_gain\s*=\s*(\{.*\}|".*?"|[^;\s]+)/i);

      if (usernameMatch || xpGainMatch) {
        const payload = {};

        if (usernameMatch) {
          const value = usernameMatch[1].trim();
          payload.username = value.startsWith('"') ? JSON.parse(value) : value;
        }

        if (xpGainMatch) {
          const value = xpGainMatch[1].trim();
          if (value.startsWith('{')) {
            payload.xp_gain = JSON.parse(normalizePortalsJsonish(value));
          } else if (value.startsWith('"')) {
            payload.xp_gain = JSON.parse(value);
          } else {
            payload.xp_gain = Number(value);
          }
        }

        return payload;
      }

      throw new Error(`Could not parse Portals message: ${raw}`);
    }

    function extractXpGain(payload) {
      const username = typeof payload.username === 'string' ? payload.username : null;
      let xpGain = payload.xp_gain;

      if (xpGain && typeof xpGain === 'object' && !Array.isArray(xpGain)) {
        if (!username) {
          throw new Error('xp_gain arrived as a player-variable map, but no username was present');
        }
        xpGain = xpGain[username];
      }

      const numeric = Number(xpGain);
      if (!Number.isFinite(numeric)) {
        throw new Error(`xp_gain is not a valid number: ${xpGain}`);
      }

      return Math.max(0, Math.floor(numeric));
    }

    function buildHeaders() {
      const headers = {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
      };

      // Legacy anon keys are JWTs and can be sent as Bearer.
      // New publishable keys are not JWTs, so skip Authorization for them.
      if (!SUPABASE_KEY.startsWith('sb_publishable_')) {
        headers['Authorization'] = `Bearer ${SUPABASE_KEY}`;
      }

      return headers;
    }

    async function callRpc(fnName, body) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: 'POST',
        headers: buildHeaders(),
        body: JSON.stringify(body),
        cache: 'no-store',
      });

      const text = await response.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = text;
      }

      if (!response.ok) {
        const message = data && typeof data === 'object' ? (data.message || JSON.stringify(data)) : String(data || response.statusText);
        throw new Error(message);
      }

      return data;
    }

    function firstRow(data) {
      return Array.isArray(data) ? data[0] : data;
    }

    async function getPlayerProgress(username) {
      const data = await callRpc('get_player_progress', { p_username: username });
      return firstRow(data);
    }

    async function addPlayerXp(username, xpGain) {
      const data = await callRpc('add_player_xp', {
        p_username: username,
        p_xp_gain: xpGain,
      });
      return firstRow(data);
    }

    async function refreshCurrentPlayer() {
      if (!currentUsername) return;
      try {
        const row = await getPlayerProgress(currentUsername);
        if (row && typeof row.xp !== 'undefined') {
          renderXp(row.xp);
          setStatus(`Synced ${currentUsername}`);
        }
      } catch (error) {
        console.error('Polling sync failed:', error);
        setStatus(`Sync error: ${error.message}`, true);
      }
    }

    function startPolling() {
      if (pollHandle) clearInterval(pollHandle);
      pollHandle = setInterval(refreshCurrentPlayer, POLL_INTERVAL_MS);
    }

    async function handlePortalsMessage(message) {
      try {
        const payload = parsePortalsMessage(message);
        const username = typeof payload.username === 'string' ? payload.username : null;
        if (!username) {
          throw new Error('Missing username in Portals message');
        }

        const xpGain = extractXpGain(payload);
        currentUsername = username;

        setStatus(`Updating ${username} (+${xpGain} XP)...`);
        const row = await addPlayerXp(username, xpGain);

        if (!row || typeof row.xp === 'undefined') {
          throw new Error('RPC returned no player row');
        }

        renderXp(row.xp);
        setStatus(`Updated ${username}: total XP ${row.xp}`);
        startPolling();
      } catch (error) {
        console.error('Portals message handling failed:', error, message);
        setStatus(`Message error: ${error.message}`, true);
      }
    }

    window.handlePortalsMessage = handlePortalsMessage;

    renderXp(0);

    <script>
  if (window.PortalsSdk && typeof window.PortalsSdk.setMessageListener === 'function') {
    window.PortalsSdk.setMessageListener((message) => {
      console.log('PORTALS MSG:', message)
      handlePortalsMessage(message)
    })
  } else {
    console.warn('PortalsSdk not found. Running in normal browser mode.')
  }
</script>
  </script>
</body>
</html>
