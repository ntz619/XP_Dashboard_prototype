<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XP Dashboard</title>
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>
  <style>
    @font-face {
      font-family: 'ObelixPro';
      src: url('./obelix-pro-3.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --panel-width: min(380px, calc(100vw - 28px));
      --bar-height: 35px;
      --fill-slant: 12px;
      --text-white: rgba(255, 255, 255, 0.98);
      --gold-1: #ffd437;
      --gold-2: #ffc400;
      --gold-3: #f3b004;
      --gold-4: #ffef99;
      --track-1: rgba(89, 66, 41, 0.88);
      --track-2: rgba(67, 48, 30, 0.92);
      --shadow-strong: 0 7px 15px rgba(0, 0, 0, 0.30);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 13px 14px;
      color: var(--text-white);
      font-family: 'ObelixPro', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      user-select: none;
      pointer-events: none;
    }

    .hud {
      width: var(--panel-width);
      position: relative;
      transform-origin: left center;
    }

    .level-row {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      margin: 0 0 2px 5px;
      position: relative;
      z-index: 3;
    }

    .level-label {
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.15px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.38);
    }

    /* ── Daily login streak pill ───────────────── */
    .streak-pill {
      display: none;
      align-items: center;
      gap: 3px;
      padding: 3px 7px 2px;
      font-size: 7px;
      line-height: 1;
      border-radius: 999px;
      color: #3d1000;
      background: linear-gradient(180deg, #fff0cc 0%, #ffb347 55%, #ff5e00 100%);
      box-shadow:
        0 4px 9px rgba(0, 0, 0, 0.22),
        0 0 9px rgba(255, 110, 0, 0.50);
      cursor: pointer;
      pointer-events: auto;
    }

    .streak-pill.active {
      display: flex;
    }

    /* ── XP Multiplier pill ─────────────────────── */
    .multiplier-pill {
      display: none;
      align-items: center;
      gap: 3px;
      padding: 3px 7px 2px;
      font-size: 7px;
      line-height: 1;
      border-radius: 999px;
      color: #1a0033;
      background: linear-gradient(180deg, #f0d4ff 0%, #c77dff 55%, #7b2fff 100%);
      box-shadow:
        0 4px 9px rgba(0, 0, 0, 0.22),
        0 0 9px rgba(160, 80, 255, 0.55);
      cursor: pointer;
      pointer-events: auto;
    }

    .multiplier-pill.active {
      display: flex;
    }

    .multiplier-timer {
      opacity: 0.80;
    }

    /* ── Multiplier info popup ───────────────────── */
    .mult-popup {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      min-width: 162px;
      background: linear-gradient(135deg, rgba(18,10,30,0.98) 0%, rgba(10,6,18,0.99) 100%);
      border: 1px solid rgba(160,80,255,0.20);
      border-radius: 7px;
      box-shadow:
        0 10px 28px rgba(0,0,0,0.72),
        0 0 18px rgba(140,70,255,0.14);
      padding: 9px 11px 8px;
      z-index: 50;
      pointer-events: auto;
      transform-origin: top left;
      animation: mp-in 180ms cubic-bezier(0.34,1.45,0.64,1) both;
    }

    @keyframes mp-in {
      from { opacity: 0; transform: translateY(-4px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    .mp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }

    .mp-icon { font-size: 14px; line-height: 1; flex-shrink: 0; }

    .mp-info { flex: 1; min-width: 0; }

    .mp-name {
      font-size: 6px;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .mp-val {
      font-size: 8.5px;
      color: rgba(255,255,255,0.88);
      margin-top: 1px;
      white-space: nowrap;
    }

    .mp-divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 5px -3px;
    }

    .mp-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 3px;
    }

    .mp-total-label {
      font-size: 6px;
      color: rgba(255,196,0,0.55);
      letter-spacing: 1.2px;
    }

    .mp-total-val {
      font-size: 11px;
      color: var(--gold-1);
      text-shadow: 0 1px 6px rgba(255,196,0,0.40);
    }

    .level-up-pill {
      opacity: 0;
      transform: translateY(4px) scale(0.9);
      padding: 3px 6px 2px;
      font-size: 7px;
      line-height: 1;
      border-radius: 999px;
      color: #553100;
      background: linear-gradient(180deg, #fff8bf 0%, #ffd64a 55%, #f2ae00 100%);
      box-shadow:
        0 4px 9px rgba(0,0,0,0.22),
        0 0 9px rgba(255, 216, 87, 0.65);
    }

    .level-up-pill.show {
      animation: level-pill 1.4s ease forwards;
    }

    .bar-shell {
      position: relative;
      width: 100%;
      filter: drop-shadow(0 6px 7px rgba(0,0,0,0.22));
    }

    .bar {
      position: relative;
      width: 100%;
      height: var(--bar-height);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(90deg, var(--track-1) 0%, var(--track-2) 100%);
      box-shadow: var(--shadow-strong);
      isolation: isolate;
    }

    .bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 22%, rgba(0,0,0,0.12) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .bar::after {
      content: '';
      position: absolute;
      inset: auto 8px -9px 8px;
      height: 9px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.12) 45%, rgba(0,0,0,0) 75%);
      filter: blur(4px);
      z-index: -1;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      min-width: 0;
      will-change: width, filter, transform;
      z-index: 0;
      overflow: visible;
    }

    .fill-shape {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.08) 24%, rgba(0,0,0,0.08) 100%),
        linear-gradient(90deg, #f2b103 0%, #ffc400 42%, #ffc400 80%, #ffdc57 100%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.22),
        inset 0 -5px 9px rgba(204,124,0,0.10),
        0 0 9px rgba(255, 206, 66, 0.18);
      clip-path: polygon(0 0, 100% 0, calc(100% - var(--fill-slant)) 100%, 0 100%);
      pointer-events: none;
    }

    .fill-shape::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.02) 34%, rgba(0,0,0,0.10) 100%);
      pointer-events: none;
    }

    .fill::after {
      content: '';
      position: absolute;
      top: -5%;
      right: -5px;
      width: 12.5px;
      height: 120%;
      transform: skewX(-22deg);
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,242,173,0.84) 42%, rgba(255,211,88,0.08) 100%);
      filter: blur(0.75px);
      box-shadow:
        0 0 11px rgba(255, 232, 150, 0.95),
        -4px 0 8px rgba(255, 201, 54, 0.32);
      opacity: 0.98;
      pointer-events: none;
      z-index: 1;
    }

    .fill .sweep {
      position: absolute;
      inset: -4% auto -4% -15%;
      width: 11%;
      opacity: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,252,223,0.62) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-20deg);
      filter: blur(2px);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 2;
    }

    .fill.animate-shimmer .sweep {
      animation: fill-sweep 900ms ease-out 1;
    }

    .xp-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 8px;
      z-index: 2;
      pointer-events: none;
    }

    .xp-main {
      font-size: 14px;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      transform-origin: left center;
    }

    .xp-main.bump {
      animation: xp-text-bump 520ms cubic-bezier(.17,.84,.44,1);
    }

    .gain-layer,
    .spark-layer,
    .flash-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 3;
    }

    .xp-gain {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      line-height: 1;
      color: #fff7bf;
      text-shadow:
        0 1px 5px rgba(0,0,0,0.45),
        0 0 7px rgba(255,227,116,0.75);
      opacity: 0;
      white-space: nowrap;
    }

    .xp-gain.show {
      animation: xp-gain-float 1.25s cubic-bezier(.2,.76,.15,1) forwards;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #fffef0 0%, #ffd95f 42%, rgba(255,186,0,0) 75%);
      box-shadow: 0 0 6px rgba(255, 224, 112, 0.75);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
    }

    .spark.show {
      animation: spark-burst var(--life, 900ms) ease-out forwards;
    }

    .flash {
      position: absolute;
      inset: -6px;
      opacity: 0;
      background: radial-gradient(circle at var(--flash-x, 50%) 50%, rgba(255,245,196,0.70) 0%, rgba(255,212,83,0.18) 28%, rgba(255,212,83,0) 58%);
      filter: blur(2px);
    }

    .flash.show {
      animation: hit-flash 540ms ease-out forwards;
    }

    .hud.hit {
      animation: hud-hit 540ms cubic-bezier(.19,.89,.32,1);
    }

    .bar.hit .fill {
      animation: fill-hit 620ms cubic-bezier(.18,.89,.32,1);
    }

    @keyframes fill-sweep {
      0%   { opacity: 0; left: -14%; }
      12%  { opacity: 0.95; }
      100% { opacity: 0; left: 56%; }
    }

    @keyframes xp-text-bump {
      0%   { transform: scale(1); }
      26%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes xp-gain-float {
      0%   { opacity: 0; transform: translateY(-50%) translateX(0) scale(0.88); }
      18%  { opacity: 1; transform: translateY(-86%) translateX(0) scale(1.02); }
      70%  { opacity: 1; transform: translateY(-118%) translateX(3px) scale(1.0); }
      100% { opacity: 0; transform: translateY(-142%) translateX(6px) scale(0.95); }
    }

    @keyframes spark-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(0, 0) scale(0.25);
      }
      12% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, 0px)) scale(1.1);
      }
    }

    @keyframes hit-flash {
      0%   { opacity: 0; transform: scale(0.96); }
      16%  { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.08); }
    }

    @keyframes hud-hit {
      0%   { transform: translateX(0) scale(1); }
      18%  { transform: translateX(1px) scale(1.008); }
      38%  { transform: translateX(-0.5px) scale(1.004); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes fill-hit {
      0%   { filter: brightness(1); }
      30%  { filter: brightness(1.13) saturate(1.08); }
      100% { filter: brightness(1); }
    }

    @keyframes level-pill {
      0%   { opacity: 0; transform: translateY(4px) scale(0.9); }
      14%  { opacity: 1; transform: translateY(0) scale(1.02); }
      68%  { opacity: 1; transform: translateY(-2px) scale(1); }
      100% { opacity: 0; transform: translateY(-5px) scale(0.98); }
    }

    /* ── Achievement / Quest toast ─────────────── */
    /* Quest variant overrides the gold accent with green */
    .ach-toast.quest-toast {
      background: linear-gradient(135deg, rgba(4,28,14,0.97) 0%, rgba(2,18,8,0.99) 100%);
      border-color: rgba(80,220,120,0.20);
    }
    .ach-toast {
      position: fixed;
      left: 14px;
      width: var(--panel-width);
      background: linear-gradient(135deg, rgba(45,28,6,0.97) 0%, rgba(28,16,2,0.99) 100%);
      border-radius: 6px;
      border: 1px solid rgba(255,196,0,0.18);
      border-left: 3px solid var(--ach-accent, var(--gold-2));
      box-shadow:
        0 6px 24px rgba(0,0,0,0.60),
        var(--ach-glow, none);
      padding: 8px 12px 10px 10px;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
      transform: translateX(calc(-100% - 20px));
      opacity: 0;
    }

    .ach-toast.ach-enter {
      transition:
        transform 500ms cubic-bezier(0.34, 1.45, 0.64, 1),
        opacity   280ms ease;
      transform: translateX(0);
      opacity: 1;
    }

    .ach-toast.ach-exit {
      transition:
        transform 360ms cubic-bezier(0.55, 0, 1, 0.45),
        opacity   360ms ease-in;
      transform: translateX(calc(-100% - 20px));
      opacity: 0;
    }

    /* shimmer sweep across toast on entry */
    .ach-toast-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 25%,
        rgba(255,255,255,0.07) 50%,
        transparent 75%
      );
      transform: translateX(-100%);
      pointer-events: none;
    }
    .ach-toast-shimmer.run {
      animation: ach-shimmer 650ms ease-out 400ms 1 forwards;
    }

    @keyframes ach-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(220%); }
    }

    .ach-toast-top {
      font-size: 6.5px;
      letter-spacing: 1.8px;
      color: rgba(255,196,0,0.50);
      margin-bottom: 5px;
    }

    .ach-toast-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ach-toast-icon {
      font-size: 26px;
      line-height: 1;
      flex-shrink: 0;
    }

    .ach-toast-name {
      font-size: 12px;
      color: var(--gold-1);
      text-shadow: 0 1px 5px rgba(255,196,0,0.35);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ach-toast-desc {
      font-size: 7.5px;
      color: rgba(255,255,255,0.38);
      margin-top: 2px;
      line-height: 1.2;
    }

    .ach-toast-rarity {
      font-size: 6.5px;
      letter-spacing: 1px;
      margin-top: 3px;
    }
    .ach-toast-rarity.legendary { color: #ffd700; }
    .ach-toast-rarity.epic      { color: #c77dff; }
    .ach-toast-rarity.rare      { color: #4da6ff; }
    .ach-toast-rarity.common    { color: rgba(255,255,255,0.28); }

    /* drain bar across the bottom showing time remaining */
    .ach-toast-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      width: 100%;
      background: var(--ach-accent, var(--gold-2));
      opacity: 0.40;
      transform-origin: left center;
    }
    .ach-toast-bar.run {
      animation: ach-bar-drain var(--ach-dur, 3500ms) linear var(--ach-bar-delay, 480ms) both;
    }

    @keyframes ach-bar-drain {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    /* legendary extra pulse ring */
    .ach-toast-pulse {
      position: absolute;
      inset: -1px;
      border-radius: 6px;
      border: 1px solid var(--ach-accent, transparent);
      opacity: 0;
      pointer-events: none;
      animation: ach-pulse 900ms ease-out 500ms 1 forwards;
    }
    @keyframes ach-pulse {
      0%   { opacity: 0.6; transform: scale(1.00); }
      100% { opacity: 0;   transform: scale(1.04); }
    }
  </style>
</head>

    const mpDividerEl     = document.getElementById('mpDivider');
    const mpTotalValEl    = document.getElementById('mpTotalVal');

    const levelUpAudio = new Audio(LEVEL_UP_SOUND_URL);
    levelUpAudio.preload = 'auto';

    function playLevelUpSound() {
      const sound = levelUpAudio.cloneNode();
      sound.volume = 1;
      sound.play().catch(() => {});
    }

    // ── XP level math ───────────────────────────────────────

    function xpNeededForLevel(level) {
      if (level <= 1) return BASE_XP_PER_LEVEL;
      if (xpTableCache[level]) return xpTableCache[level];
      for (let i = xpTableCache.length; i <= level; i++) {
        const raw = BASE_XP_PER_LEVEL * Math.pow(XP_GROWTH_FACTOR, i - 1);
        const rounded = Math.round(raw / XP_STEP_ROUNDING) * XP_STEP_ROUNDING;
        xpTableCache[i] = Math.max(rounded, xpTableCache[i - 1] + MIN_XP_STEP);
      }
      return xpTableCache[level];
    }

    function deriveLevelData(totalXp) {
      const xp = Math.max(0, Number(totalXp) || 0);
      let level = 1, remainingXp = xp, needed = xpNeededForLevel(level);
      while (remainingXp >= needed) { remainingXp -= needed; level += 1; needed = xpNeededForLevel(level); }
      return { xp, level, current: remainingXp, needed, percent: needed > 0 ? (remainingXp / needed) * 100 : 0 };
    }

    function setFillWidth(percent) {
      const clamped = Math.max(0, Math.min(100, Number(percent) || 0));
      fillEl.style.width = clamped <= 0 ? '0%' : `calc(${clamped}% + var(--fill-slant))`;
    }

    function renderXp(totalXp) {
      const { level, current, needed, percent } = deriveLevelData(totalXp);
      levelLabelEl.textContent = `Level ${level}`;
      xpTextEl.textContent = `${Math.round(current)}/${needed}`;
      setFillWidth(percent);
      displayedTotalXp = Number(totalXp) || 0;
    }

    // ── XP multiplier display ───────────────────────────────

    function formatCountdown(seconds) {
      const s = Math.max(0, Math.round(seconds));
      const m = Math.floor(s / 60);
      return m > 0 ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`;
    }

    function updateMultiplierDisplay(row) {
      if (!row) return;
      const mult     = Number(row.xp_multiplier) || 1.0;
      const expiry   = row.xp_multiplier_expires_at ? new Date(row.xp_multiplier_expires_at) : null;
      const timedOn  = mult > 1.0 && expiry && expiry.getTime() > Date.now();
      currentTimedMult   = timedOn ? mult   : 1.0;
      currentTimedExpiry = timedOn ? expiry : null;
      refreshMultiplierPill();
    }

    // ── Daily login streak display ──────────────────────────

    function updateStreakDisplay(row) {
      if (!row) return;
      currentStreak = Number(row.daily_login_streak) || 0;
      if (currentStreak >= 7)       currentStreakMult = 1.2;
      else if (currentStreak >= 3)  currentStreakMult = 1.1;
      else                          currentStreakMult = 1.0;

      if (currentStreak > 0) {
        streakLabelEl.textContent = `🔥 ${currentStreak}`;
        streakPillEl.classList.add('active');
      } else {
        streakPillEl.classList.remove('active');
      }

      refreshMultiplierPill();
      if (multPopupOpen) renderMultPopup();
    }

    // ── Combined multiplier pill ────────────────────────────

    function refreshMultiplierPill() {
      if (multiplierInterval) { clearInterval(multiplierInterval); multiplierInterval = null; }

      const timedOn  = currentTimedMult > 1.0 && currentTimedExpiry && currentTimedExpiry.getTime() > Date.now();
      const combined = (timedOn ? currentTimedMult : 1.0) * currentStreakMult;

      if (combined <= 1.005) {          // nothing meaningful active
        multiplierPillEl.classList.remove('active');
        return;
      }

      multiplierPillEl.classList.add('active');
      multiplierLabelEl.textContent = `${combined.toFixed(1)}X XP`;
      multiplierTimerEl.textContent = '';

      if (timedOn) {
        const tick = () => {
          const secsLeft = (currentTimedExpiry.getTime() - Date.now()) / 1000;
          if (secsLeft <= 0) {
            clearInterval(multiplierInterval); multiplierInterval = null;
            currentTimedMult = 1.0; currentTimedExpiry = null;
            refreshMultiplierPill();
            if (multPopupOpen) renderMultPopup();
            return;
          }
          const live = currentTimedMult * currentStreakMult;
          multiplierLabelEl.textContent = `${live.toFixed(1)}X XP`;
          multiplierTimerEl.textContent = formatCountdown(secsLeft);
          if (multPopupOpen) renderMultPopup();
        };
        tick();
        multiplierInterval = setInterval(tick, 1000);
      }
    }

    // ── Multiplier popup ────────────────────────────────────

    function renderMultPopup() {
      const timedOn  = currentTimedMult > 1.0 && currentTimedExpiry && currentTimedExpiry.getTime() > Date.now();
      const streakOn = currentStreakMult > 1.005;
      const hasTwo   = timedOn && streakOn;

      // Streak row
      mpStreakRowEl.style.display = streakOn ? 'flex' : 'none';
      if (streakOn) {
        mpStreakNameEl.textContent = `${currentStreak}-DAY STREAK`;
        mpStreakValEl.textContent  = currentStreak >= 7 ? '+20% XP' : '+10% XP';
      }

      // Timed boost row
      mpBoostRowEl.style.display = timedOn ? 'flex' : 'none';
      if (timedOn) {
        const secsLeft = Math.max(0, (currentTimedExpiry.getTime() - Date.now()) / 1000);
        mpBoostValEl.textContent = `${currentTimedMult.toFixed(1)}X · ${formatCountdown(secsLeft)} left`;
      }

      // Divider only when both rows are visible
      mpDividerEl.style.display = hasTwo ? 'block' : 'none';

      // Total
      const combined = (timedOn ? currentTimedMult : 1.0) * currentStreakMult;
      mpTotalValEl.textContent = `${combined.toFixed(1)}X XP`;
    }

    function openMultPopup() {
      multPopupOpen = true;
      renderMultPopup();
      // Re-trigger entry animation
      multPopupEl.style.display = 'none';
      void multPopupEl.offsetWidth;
      multPopupEl.style.display = 'block';
      if (multPopupAutoClose) clearTimeout(multPopupAutoClose);
      multPopupAutoClose = setTimeout(closeMultPopup, 6000);
    }

    function closeMultPopup() {
      multPopupOpen = false;
      multPopupEl.style.display = 'none';
      if (multPopupAutoClose) { clearTimeout(multPopupAutoClose); multPopupAutoClose = null; }
    }

    function toggleMultPopup() {
      multPopupOpen ? closeMultPopup() : openMultPopup();
    }

    // ── Row helpers ─────────────────────────────────────────

    function statsFromRow(row) {
      return {
        plays_quadclaim: Number(row.plays_quadclaim) || 0,
        plays_memoryclaim: Number(row.plays_memoryclaim) || 0,
        plays_gunspleef: Number(row.plays_gunspleef) || 0,
        plays_runspleef: Number(row.plays_runspleef) || 0,
        wins_quadclaim: Number(row.wins_quadclaim) || 0,
        wins_memoryclaim: Number(row.wins_memoryclaim) || 0,
        wins_gunspleef: Number(row.wins_gunspleef) || 0,
        wins_runspleef: Number(row.wins_runspleef) || 0,
        daily_login_streak: Number(row.daily_login_streak) || 0,
        best_login_streak: Number(row.best_login_streak) || 0,
        active_days_total: Number(row.active_days_total) || 0,
        last_login_date: row.last_login_date || null,
        first_game_played: row.first_game_played || null,
        last_game_played: row.last_game_played || null,
        favorite_game: row.favorite_game || null,
        created_at: row.created_at || null,
        updated_at: row.updated_at || null,
        last_seen_at: row.last_seen_at || null
      };
    }

    function applyPlayerRow(row) {
      if (!row || typeof row !== 'object') return;
      const nextXp = Number(row.xp) || 0;
      renderXp(nextXp);
      displayedTotalXp = nextXp;
      currentPetId = row.pet_id == null ? null : Number(row.pet_id);
      window.currentPetId = currentPetId;
      currentStats = statsFromRow(row);
      window.currentStats = currentStats;
      updateMultiplierDisplay(row);
      updateStreakDisplay(row);
    }

    function updateStatsWithoutRenderingXp(row) {
      if (!row || typeof row !== 'object') return;
      currentPetId = row.pet_id == null ? currentPetId : Number(row.pet_id);
      window.currentPetId = currentPetId;
      currentStats = statsFromRow(row);
      window.currentStats = currentStats;
      updateMultiplierDisplay(row);
      updateStreakDisplay(row);
    }

    // ── Animations ──────────────────────────────────────────

    function animateNumberToXp(targetXp, xpGain = 0) {
      const startXp = displayedTotalXp;
      const endXp = Math.max(0, Number(targetXp) || 0);
      const startLevel = deriveLevelData(startXp).level;
      const duration = Math.min(1500, Math.max(650, Math.abs(endXp - startXp) * 12));
      const startedAt = performance.now();
      if (animationFrame) cancelAnimationFrame(animationFrame);
      triggerGainEffects(xpGain);
      let levelFxTriggered = startLevel;
      function frame(now) {
        const t = Math.min(1, (now - startedAt) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const value = startXp + (endXp - startXp) * eased;
        const { level, current, needed, percent } = deriveLevelData(value);
        levelLabelEl.textContent = `Level ${level}`;
        xpTextEl.textContent = `${Math.round(current)}/${needed}`;
        setFillWidth(percent);
        displayedTotalXp = value;
        if (level > levelFxTriggered) { levelFxTriggered = level; triggerLevelUp(level); }
        if (t < 1) { animationFrame = requestAnimationFrame(frame); }
        else { animationFrame = null; renderXp(endXp); }
      }
      animationFrame = requestAnimationFrame(frame);
    }

    function triggerGainEffects(xpGain) {
      const gain = Math.max(0, Number(xpGain) || 0);
      hudEl.classList.remove('hit'); barEl.classList.remove('hit');
      fillEl.classList.remove('animate-shimmer'); xpTextEl.classList.remove('bump');
      void hudEl.offsetWidth;
      hudEl.classList.add('hit'); barEl.classList.add('hit');
      fillEl.classList.add('animate-shimmer'); xpTextEl.classList.add('bump');
      if (gain > 0) { spawnGainText(gain); spawnSparkBurst(); spawnFlash(); }
      setTimeout(() => {
        hudEl.classList.remove('hit'); barEl.classList.remove('hit');
        fillEl.classList.remove('animate-shimmer'); xpTextEl.classList.remove('bump');
      }, 900);
    }

    function spawnGainText(gain) {
      const el = document.createElement('div');
      el.className = 'xp-gain';
      el.textContent = `+${gain} XP`;
      gainLayerEl.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    function spawnSparkBurst() {
      const width = barEl.clientWidth;
      const fillWidth = Math.max(9, fillEl.getBoundingClientRect().width);
      const centerX = Math.min(width - 12, Math.max(13, fillWidth));
      const centerY = barEl.clientHeight / 2;
      for (let i = 0; i < 12; i++) {
        const angle = (-70 + (140 / 11) * i) * (Math.PI / 180);
        const distance = 10 + Math.random() * 21;
        const spark = document.createElement('div');
        spark.className = 'spark';
        spark.style.left = `${centerX}px`;
        spark.style.top = `${centerY}px`;
        spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        spark.style.setProperty('--life', `${650 + Math.random() * 350}ms`);
        sparkLayerEl.appendChild(spark);
        requestAnimationFrame(() => spark.classList.add('show'));
        spark.addEventListener('animationend', () => spark.remove(), { once: true });
      }
    }

    function spawnFlash() {
      const width = barEl.clientWidth;
      const fillWidth = Math.max(9, fillEl.getBoundingClientRect().width);
      const x = Math.min(width - 5, Math.max(4, fillWidth));
      const flash = document.createElement('div');
      flash.className = 'flash';
      flash.style.setProperty('--flash-x', `${(x / width) * 100}%`);
      flashLayerEl.appendChild(flash);
      requestAnimationFrame(() => flash.classList.add('show'));
      flash.addEventListener('animationend', () => flash.remove(), { once: true });
    }

    function triggerLevelUp(level) {
      levelUpPillEl.textContent = `LEVEL ${level}!`;
      levelUpPillEl.classList.remove('show');
      void levelUpPillEl.offsetWidth;
      levelUpPillEl.classList.add('show');
      playLevelUpSound(); spawnFlash(); spawnSparkBurst();
    }

    // ── Portals message parsing ─────────────────────────────

    function normalizePortalsJsonish(raw) {
      return String(raw).trim()
        .replace(/=\s*(?=[\[{\"\-\dtruefalsen])/g, ':')
        .replace(/\r?\n/g, ' ');
    }

    function parsePortalsMessage(rawMessage) {
      const raw = String(rawMessage || '').trim();
      if (!raw) throw new Error('Empty message');
      for (const candidate of [raw, normalizePortalsJsonish(raw)]) {
        try { const p = JSON.parse(candidate); if (p && typeof p === 'object') return p; } catch (_) {}
      }
      const usernameMatch = raw.match(/username\s*=\s*(\".*?\"|[^\s;]+)/i);
      const fallbackFields = [
        'xp_gain', 'xp_source', 'pet_id', 'source_game', 'seen',
        'plays_quadclaim', 'plays_memoryclaim', 'plays_gunspleef', 'plays_runspleef',
        'wins_quadclaim', 'wins_memoryclaim', 'wins_gunspleef', 'wins_runspleef',
        'xp_multiplier', 'xp_multiplier_length'
      ];
      const payload = {};
      if (usernameMatch) {
        const v = usernameMatch[1].trim();
        payload.username = v.startsWith('"') ? JSON.parse(v) : v;
      }
      for (const field of fallbackFields) {
        const match = raw.match(new RegExp(`${field}\\s*=\\s*(\\{.*\\}|"[^"]*"|[^;\\s]+)`, 'i'));
        if (!match) continue;
        const value = match[1].trim();
        if (value.startsWith('{')) payload[field] = JSON.parse(normalizePortalsJsonish(value));
        else if (value.startsWith('"')) payload[field] = JSON.parse(value);
        else if (value === 'true') payload[field] = true;
        else if (value === 'false') payload[field] = false;
        else if (!Number.isNaN(Number(value))) payload[field] = Number(value);
        else payload[field] = value;
      }
      if (Object.keys(payload).length > 0) return payload;
      throw new Error(`Could not parse Portals message: ${raw}`);
    }

    function hasOwn(obj, key) { return Object.prototype.hasOwnProperty.call(obj, key); }

    function getPayloadValue(payload, fieldName) {
      const username = typeof payload.username === 'string' ? payload.username : null;
      let value = payload[fieldName];
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        if (!username) throw new Error(`${fieldName} arrived as player-variable map but no username present`);
        value = value[username];
      }
      return value;
    }

    function extractNumericField(payload, fieldName) {
      const value = getPayloadValue(payload, fieldName);
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) throw new Error(`${fieldName} is not a valid number: ${value}`);
      return Math.floor(numeric);
    }

    function extractFloatField(payload, fieldName) {
      const value = getPayloadValue(payload, fieldName);
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) throw new Error(`${fieldName} is not a valid number: ${value}`);
      return numeric;
    }

    function extractStringField(payload, fieldName) {
      const value = getPayloadValue(payload, fieldName);
      if (value == null) return null;
      return String(value).trim() || null;
    }

    function extractBooleanField(payload, fieldName) {
      const value = getPayloadValue(payload, fieldName);
      if (value === true  || value === 'true'  || value === 1 || value === '1') return true;
      if (value === false || value === 'false' || value === 0 || value === '0') return false;
      return Boolean(value);
    }

    function buildPatchBody(payload) {
      const username = typeof payload.username === 'string' ? payload.username.trim() : '';
      if (!username) throw new Error('Missing username in Portals message');
      const body = { p_username: username };

      if (hasOwn(payload, 'source_game'))  body.p_source_game = extractStringField(payload, 'source_game');
      if (hasOwn(payload, 'xp_source'))    body.p_xp_source   = extractStringField(payload, 'xp_source');
      if (hasOwn(payload, 'seen'))         body.p_seen        = extractBooleanField(payload, 'seen');
      if (hasOwn(payload, 'xp_gain'))      body.p_xp_gain     = Math.max(0, extractNumericField(payload, 'xp_gain'));
      if (hasOwn(payload, 'pet_id'))       body.p_pet_id      = extractNumericField(payload, 'pet_id');

      if (hasOwn(payload, 'xp_multiplier') && hasOwn(payload, 'xp_multiplier_length')) {
        const mult   = extractFloatField(payload, 'xp_multiplier');
        const length = extractNumericField(payload, 'xp_multiplier_length');
        if (mult > 1.0 && length > 0) {
          body.p_xp_multiplier        = mult;
          body.p_xp_multiplier_length = length;
        }
      }

      for (const field of COUNTER_FIELDS) {
        if (hasOwn(payload, field)) body[`p_${field}`] = Math.max(0, extractNumericField(payload, field));
      }
      return body;
    }

    // ── Supabase RPC ────────────────────────────────────────

    function buildHeaders() {
      const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY };
      if (!SUPABASE_KEY.startsWith('sb_publishable_')) headers['Authorization'] = `Bearer ${SUPABASE_KEY}`;
      return headers;
    }

    async function callRpc(fnName, body) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: 'POST', headers: buildHeaders(), body: JSON.stringify(body), cache: 'no-store',
      });
      const text = await response.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!response.ok) {
        const message = data && typeof data === 'object' ? (data.message || JSON.stringify(data)) : String(data || response.statusText);
        throw new Error(message);
      }
      return data;
    }

    function firstRow(data) { return Array.isArray(data) ? data[0] : data; }

    async function patchPlayerProgress(payload) {
      return firstRow(await callRpc('patch_player_progress', buildPatchBody(payload)));
    }

    async function getPlayerProgress(username) {
      return firstRow(await callRpc('get_player_progress', { p_username: username }));
    }

    async function refreshCurrentPlayer() {
      if (!currentUsername) return;
      try {
        const row = await getPlayerProgress(currentUsername);
        if (row && typeof row.xp !== 'undefined') {
          applyPlayerRow(row);
          if (!hasInitialXpLoaded) hasInitialXpLoaded = true;
        }
      } catch (error) { console.error('Polling sync failed:', error); }
    }

    function startPolling() {
      if (pollHandle) clearInterval(pollHandle);
      pollHandle = setInterval(refreshCurrentPlayer, POLL_INTERVAL_MS);
    }

    // ── Main message handler ────────────────────────────────

    async function handlePortalsMessage(message) {
      try {
        const payload  = parsePortalsMessage(message);
        const username = typeof payload.username === 'string' ? payload.username : null;
        if (!username) throw new Error('Missing username in Portals message');

        currentUsername = username;

        const hasXpGain = hasOwn(payload, 'xp_gain');
        const latestRow = await patchPlayerProgress(payload);

        if (!latestRow || typeof latestRow.xp === 'undefined') {
          throw new Error('patch_player_progress returned no player row');
        }

        const nextXp = Number(latestRow.xp) || 0;

        if (!hasInitialXpLoaded) {
          applyPlayerRow(latestRow);
          hasInitialXpLoaded = true;
        } else if (hasXpGain && nextXp !== displayedTotalXp) {
          // Show effective gain (after multiplier) in the floating text
          const effectiveGain = nextXp - displayedTotalXp;
          updateStatsWithoutRenderingXp(latestRow);
          animateNumberToXp(nextXp, effectiveGain);
        } else {
          applyPlayerRow(latestRow);
          hasInitialXpLoaded = true;
        }

        startPolling();

        // Fire-and-forget notification checks (achievements + quests share the same queue)
        callRpc('pop_unnotified_achievements', { p_username: username })
          .then(achs => { if (Array.isArray(achs) && achs.length) queueAchievementToasts(achs); })
          .catch(() => {});
        callRpc('pop_completed_quest_notifications', { p_username: username })
          .then(quests => {
            if (!Array.isArray(quests) || !quests.length) return;
            // Normalise quest objects to match the toast renderer's expected shape
            queueAchievementToasts(quests.map(q => ({
              _type:       'quest',
              name:        q.title,
              description: q.description,
              icon:        q.icon,
              rarity:      q.quest_type === 'weekly' ? 'epic' : 'rare',  // visual weight
              xp_reward:   q.xp_reward
            })));
          })
          .catch(() => {});
      } catch (error) {
        console.error('Portals message handling failed:', error, message);
      }
    }

    // ── Achievement Toast System ──────────────────────────────
    const ACH_RARITY_STYLES = {
      legendary: { accent: '#ffd700', glow: '0 0 20px rgba(255,210,0,0.30), 0 0 40px rgba(255,210,0,0.12)' },
      epic:      { accent: '#c77dff', glow: '0 0 18px rgba(160,80,255,0.30), 0 0 36px rgba(160,80,255,0.10)' },
      rare:      { accent: '#4da6ff', glow: '0 0 15px rgba(77,166,255,0.25)' },
      common:    { accent: 'rgba(255,255,255,0.28)', glow: 'none' }
    };
    const TOAST_DISPLAY_MS = 3500;
    const TOAST_GAP_MS     = 250;
    const achToastQueue    = [];
    let   achToastActive   = false;

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function queueAchievementToasts(achs) {
      for (const a of achs) achToastQueue.push(a);
      if (!achToastActive) drainAchievementQueue();
    }

    async function drainAchievementQueue() {
      if (!achToastQueue.length) { achToastActive = false; return; }
      achToastActive = true;
      await showAchievementToast(achToastQueue.shift());
      await new Promise(r => setTimeout(r, TOAST_GAP_MS));
      drainAchievementQueue();
    }

    function showAchievementToast(ach) {
      return new Promise(resolve => {
        const isQuest    = ach._type === 'quest';
        const style      = isQuest
          ? { accent: '#3ecb70', glow: '0 0 16px rgba(62,203,112,0.28), 0 0 32px rgba(62,203,112,0.10)' }
          : (ACH_RARITY_STYLES[ach.rarity] || ACH_RARITY_STYLES.common);
        const rarityLabel = isQuest
          ? (ach.xp_reward ? '+' + Number(ach.xp_reward).toLocaleString() + ' XP' : 'Quest')
          : (ach.rarity.charAt(0).toUpperCase() + ach.rarity.slice(1));
        const headerText  = isQuest ? '⚔️ QUEST COMPLETE' : '🏆 ACHIEVEMENT UNLOCKED';
        const hudRect    = hudEl.getBoundingClientRect();
        const topPx      = hudRect.bottom + 8;

        const toast = document.createElement('div');
        toast.className = 'ach-toast' + (isQuest ? ' quest-toast' : '');
        toast.style.top = topPx + 'px';
        toast.style.setProperty('--ach-accent', style.accent);
        toast.style.setProperty('--ach-glow',   style.glow);
        toast.style.setProperty('--ach-dur',     TOAST_DISPLAY_MS + 'ms');
        toast.innerHTML = `
          <div class="ach-toast-shimmer run"></div>
          <div class="ach-toast-top">${headerText}</div>
          <div class="ach-toast-main">
            <div class="ach-toast-icon">${ach.icon}</div>
            <div class="ach-toast-info">
              <div class="ach-toast-name">${escHtml(ach.name)}</div>
              <div class="ach-toast-desc">${escHtml(ach.description)}</div>
              <div class="ach-toast-rarity ${isQuest ? 'rare' : ach.rarity}">${rarityLabel}</div>
            </div>
          </div>
          ${ach.rarity === 'legendary' && !isQuest ? '<div class="ach-toast-pulse"></div>' : ''}
          <div class="ach-toast-bar run"></div>
        `;
        document.body.appendChild(toast);

        // Double rAF ensures the initial transform is painted before the enter class fires
        requestAnimationFrame(() => requestAnimationFrame(() => { toast.classList.add('ach-enter'); }));

        setTimeout(() => {
          toast.classList.remove('ach-enter');
          toast.classList.add('ach-exit');
          toast.addEventListener('transitionend', () => { toast.remove(); resolve(); }, { once: true });
          setTimeout(resolve, 500); // safety fallback if transitionend never fires
        }, TOAST_DISPLAY_MS);
      });
    }

    // ── Pill click → toggle multiplier popup ───────────────
    multiplierPillEl.addEventListener('click', e => { e.stopPropagation(); toggleMultPopup(); });
    streakPillEl.addEventListener('click',     e => { e.stopPropagation(); toggleMultPopup(); });

    window.handlePortalsMessage = handlePortalsMessage;
    window.currentPetId = currentPetId;
    window.currentStats = currentStats;

    renderXp(0);

    PortalsSdk.setMessageListener((message) => { handlePortalsMessage(message); });

    window.addEventListener('message', (event) => {
      if (typeof event.data === 'string') {
        // fallback kept for browser/dev environments
      }
    });
  </script>
</body>
</html>
