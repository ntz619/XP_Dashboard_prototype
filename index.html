<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XP Dashboard</title>

  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>

  <style>
    @font-face {
      font-family: 'ObelixPro';
      src: url('./obelix-pro-3.ttf') format('truetype');
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: white;
      font-family: 'ObelixPro', Arial, sans-serif;
      overflow: hidden;
    }

    .wrap {
      width: 640px;
      padding: 22px 28px;
      box-sizing: border-box;
    }

    .level-label {
      font-size: 18px;
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .xp-text {
      font-size: 28px;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .bar {
      width: 100%;
      height: 40px;
      background: rgba(65, 45, 28, 0.82);
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      overflow: hidden;
      position: relative;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0b400 0%, #ffc400 80%, #fff0a6 92%, #ffca28 100%);
      position: relative;
      transition: width 300ms ease;
    }

    .fill::after {
      content: "";
      position: absolute;
      top: 0;
      right: -16px;
      width: 32px;
      height: 100%;
      transform: skewX(-20deg);
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.15));
      filter: blur(0.5px);
    }

    .debug {
      margin-top: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #7CFF7C;
      white-space: pre-wrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="levelLabel" class="level-label">Level 1</div>
    <div id="xpText" class="xp-text">0/100</div>
    <div class="bar">
      <div id="fill" class="fill"></div>
    </div>
    <div id="debug" class="debug">Awaiting message...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tpdedcjccygpwkofdyqg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kYGFYlXrQHt17-uihwy7tA_CxkbQYNH';

    const levelLabel = document.getElementById('levelLabel');
    const xpText = document.getElementById('xpText');
    const fill = document.getElementById('fill');
    const debug = document.getElementById('debug');

    function setDebug(text) {
      console.log(text);
      debug.textContent = text;
    }

    function xpNeededForLevel(level) {
      return 100;
    }

    function computeLevel(totalXp) {
      const level = Math.floor(totalXp / 100) + 1;
      const currentXp = totalXp % 100;
      const neededXp = xpNeededForLevel(level);
      return { level, currentXp, neededXp };
    }

    function render(totalXp) {
      const safeXp = Math.max(0, Number(totalXp) || 0);
      const { level, currentXp, neededXp } = computeLevel(safeXp);
      levelLabel.textContent = `Level ${level}`;
      xpText.textContent = `${currentXp}/${neededXp}`;
      fill.style.width = `${Math.max(0, Math.min(100, (currentXp / neededXp) * 100))}%`;
    }

    async function rpc(fn, body) {
      const headers = {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
      };

      if (SUPABASE_KEY.split('.').length === 3) {
        headers['Authorization'] = `Bearer ${SUPABASE_KEY}`;
      }

      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST',
        headers,
        body: JSON.stringify(body),
      });

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw data || { message: `HTTP ${response.status}` };
      }

      return data;
    }

    async function getPlayerProgress(username) {
      const result = await rpc('get_player_progress', { p_username: username });
      return Array.isArray(result) ? result[0] : result;
    }

    async function addPlayerXp(username, xpGain) {
      const result = await rpc('add_player_xp', {
        p_username: username,
        p_xp_gain: xpGain,
      });
      return Array.isArray(result) ? result[0] : result;
    }

    function parseMessage(raw) {
      const payload = JSON.parse(raw);

      const username = payload.username;
      let xpGain = payload.xp_gain;

      if (xpGain && typeof xpGain === 'object' && username in xpGain) {
        xpGain = xpGain[username];
      }

      xpGain = Number(xpGain || 0);

      return {
        username,
        xpGain: Number.isFinite(xpGain) ? xpGain : 0,
      };
    }

    async function handlePortalsMessage(message) {
      setDebug(`PORTALS MSG: ${message}`);

      let parsed;
      try {
        parsed = parseMessage(message);
      } catch (error) {
        setDebug(`Parse error: ${String(error)}`);
        return;
      }

      if (!parsed.username) {
        setDebug('Missing username');
        return;
      }

      try {
        const updated = await addPlayerXp(parsed.username, parsed.xpGain);
        const totalXp = Number(updated?.xp || 0);
        render(totalXp);
        setDebug(`Updated ${parsed.username}: +${parsed.xpGain} XP => ${totalXp}`);
      } catch (error) {
        console.error(error);
        setDebug(`DB error: ${JSON.stringify(error)}`);
      }
    }

    PortalsSdk.setMessageListener((message) => {
      handlePortalsMessage(message);
    });

    window.addEventListener('message', (event) => {
      if (typeof event.data === 'string') {
        console.log('Raw postMessage fallback:', event.data);
      }
    });
  </script>
</body>
</html>
